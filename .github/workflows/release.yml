# The release workflow.
#
# A release is made from a tag, not from a branch. The tag is the version:
# `v2.0.0-alpha.1` publishes the artifact for that version, and the
# changelog is expected to already describe it.
#
# The `.xpi` is signed by the workflow when the signing secrets are present,
# and is published unsigned otherwise. Firefox will install an unsigned
# `.xpi` temporarily, which is enough to try a release; a permanent install
# needs a signature from addons.mozilla.org.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release (e.g. v2.0.0-alpha.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser for the end-to-end tests
        # `npm run verify` includes the end-to-end tests, and those tests drive
        # a real Firefox. Without the browser installed the release fails on a
        # missing browser rather than on anything to do with the release.
        run: npm run test:e2e:install-firefox

      - name: Verify
        run: npm run verify

      - name: Package
        run: npm run package

      - name: Sign the package
        # The signing secrets are absent on a fork, and the release should
        # still be published — an unsigned `.xpi` is installable temporarily.
        env:
          WEB_EXT_ID: ${{ secrets.WEB_EXT_ID }}
          WEB_EXT_SECRET: ${{ secrets.WEB_EXT_SECRET }}
        run: |
          if [ -n "$WEB_EXT_ID" ] && [ -n "$WEB_EXT_SECRET" ]; then
            npx web-ext sign \
              --source-dir dist \
              --api-key "$WEB_EXT_ID" \
              --api-secret "$WEB_EXT_SECRET" \
              --id "$WEB_EXT_ID" \
              --artifacts-dir release/signed
          else
            echo "No signing secrets configured; publishing an unsigned package."
          fi

      - name: Collect the release artifacts
        # The exact files that are published, rather than a glob. A glob would
        # happily pick up a `.xpi` left over from an earlier version, and
        # `fail_on_unmatched_files` only catches the case where *nothing*
        # matches.
        run: |
          set -eu
          files=$(find release -type f -name '*.xpi' | sort)
          if [ -z "$files" ]; then
            echo "::error::The packaging step produced no .xpi to publish."
            exit 1
          fi
          echo "Publishing:"
          echo "$files"
          {
            echo "RELEASE_FILES<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILES }}
          fail_on_unmatched_files: true
          generate_release_notes: true
